<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Page-scale parquet grain for the ivory ground: walnut lines at 6%. -->
  <g fill="none" stroke="#1A1612" stroke-opacity="0.06" stroke-width="2">
    <rect x="0" y="0" width="150" height="50"/><rect x="0" y="50" width="150" height="50"/><rect x="0" y="100" width="150" height="50"/>
    <rect x="150" y="0" width="50" height="150"/><rect x="200" y="0" width="50" height="150"/><rect x="250" y="0" width="50" height="150"/>
    <rect x="0" y="150" width="50" height="150"/><rect x="50" y="150" width="50" height="150"/><rect x="100" y="150" width="50" height="150"/>
    <rect x="150" y="150" width="150" height="50"/><rect x="150" y="200" width="150" height="50"/><rect x="150" y="250" width="150" height="50"/>
  </g>
</svg>
