<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floorcount title card</title>
<style>
/* Video title card, 1920 x 1080. The floor is the ground (law 1), the strip is the device (law 18),
   the wordmark carries the 1. Nothing else. */
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("fonts/AtkinsonHyperlegibleNext-Medium.ttf") format("truetype"); font-weight: 500; }
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf") format("truetype"); font-weight: 800; }
html, body { margin: 0; }
body { width: 1920px; height: 1080px; overflow: hidden; background: #1A1612 url("parquet-page-dark.svg") center / 240px 240px;
  color: #F7EEDF; font-family: "Atkinson Hyperlegible Next", sans-serif; font-weight: 500; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 180px; }
.wordmark { width: 1100px; aspect-ratio: 1600 / 242; background: url("export/wordmark-ivory.png") no-repeat left / contain; }
.strip { display: flex; gap: 24px; margin: 56px 0 72px 8px; }
.strip i { display: block; width: 96px; height: 48px; border-radius: 999px; background: #F7EEDF; opacity: .35; }
.strip i.uno { background: #5FB4E8; opacity: 1; }
.strip i.hold { background: none; border: 5px solid #F7EEDF; opacity: .35; }
.line { font-size: 56px; line-height: 1.2; max-width: 1300px; margin: 0; }
.sub { font-size: 32px; opacity: .75; margin: 20px 0 0; }
.site { font-size: 28px; opacity: .5; margin: 64px 0 0; letter-spacing: .01em; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark" role="img" aria-label="Floorcount"></div>
  <div class="strip" aria-hidden="true"><i class="uno"></i><i></i><i></i><i class="hold"></i><i></i><i></i><i></i><i class="hold"></i></div>
  <p class="line">The salsa count, on your own floor.</p>
  <p class="sub">A practice Lens for SPECS, built in Lens Studio by CLAD</p>
  <p class="site">jonathansolvesproblems.com</p>
</div>
</body>
</html>
